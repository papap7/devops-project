#cloud-config
package_update: true
ssh_pwauth: false

groups:
  - docker

users:
  - default
  - name: ubuntu
    groups: docker
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJKl7JjkorF6N/FNYJxU+RDaEGgzhg9fsHClWMAK99e7 jptenorio@Mac_devbox-server_2026-10-25

runcmd:
  - |
    set -eu
    export DEBIAN_FRONTEND=noninteractive

    echo "Adding Docker's official GPG key..."
    apt update
    apt install -y ca-certificates curl
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc

    echo "Adding the repository to Apt sources..."
    tee /etc/apt/sources.list.d/docker.sources <<EOF
    Types: deb
    URIs: https://download.docker.com/linux/ubuntu
    Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
    Components: stable
    Architectures: $(dpkg --print-architecture)
    Signed-By: /etc/apt/keyrings/docker.asc
    EOF
    echo "Set up Docker's apt repository, DONE."

    echo "Installing Docker packages..."
    apt update
    apt install -y \
      docker-ce \
      docker-ce-cli \
      containerd.io \
      docker-buildx-plugin \
      docker-compose-plugin
    echo "FINISHED SETTING UP DOCKER."

    echo "UFW setup starting..."
    apt install -y ufw
    CLOUD=$(cloud-init query v1.cloud_name 2>/dev/null || echo unknown)
    echo "Cloud= $CLOUD"
    if [ "$CLOUD" = 'aws' ]; then
      # EC2: SSH arrives from my public IP, not from the VPC gateway.
      # The security group limits the source to my IP; UFW opens the port.
      ufw allow 22/tcp comment 'SSH, source limited by EC2 security group'
    else
      # Multipass: the default gateway is my Mac.
      echo "Getting the Default Gateway Address of the VM..."
      GATEWAY_IP=$(ip route | awk '/^default/ {print $3}')
      echo "${GATEWAY_IP:?GATEWAY_IP is empty}"
      ufw allow proto tcp from "$GATEWAY_IP" to any port 22 comment 'Macbook SSH'
    fi
    ufw allow 80/tcp
    ufw --force enable
    echo "Finished UFW setup."
